name: flutter_iot
description: A production-ready Flutter IoT plugin providing a unified Dart API for BLE, Wi-Fi, MQTT, WebSocket, HTTP, TCP, and UDP device communication.
version: 0.0.1
homepage: https://github.com/Githubsaveme/flutter_iot
repository: https://github.com/Githubsaveme/flutter_iot
issue_tracker: https://github.com/Githubsaveme/flutter_iot/issues

environment:
  sdk: ^3.12.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.0.0
  plugin_platform_interface: ^2.0.2
  http: ^1.2.0
  web_socket_channel: ^3.0.0
  async: ^2.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.flutter_iot
        pluginClass: FlutterIotPlugin
      ios:
        pluginClass: FlutterIotPlugin
      linux:
        pluginClass: FlutterIotPlugin
      macos:
        pluginClass: FlutterIotPlugin
      windows:
        pluginClass: FlutterIotPluginCApi
      web:
        pluginClass: FlutterIotWeb
        fileName: flutter_iot_web.dart
